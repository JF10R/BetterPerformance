name: Offline diagnostics checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Aggregation, export, and concurrency tests
        run: dotnet run --project tests/BetterPerformance.Tests -c Release -- --fixture-output .qa/synthetic.jsonl
      - name: Report tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Export-to-report integration
        run: python scripts/summarize_capture.py .qa/synthetic.jsonl --output .qa/report.md

  # Game-dependent compilation is local: proprietary game assemblies are not uploaded to CI.
